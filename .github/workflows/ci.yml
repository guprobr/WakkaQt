name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mirrors readme.md's "Building on Linux" prerequisites, minus the
      # FFmpeg dev packages (see "Install a newer FFmpeg dev stack" below —
      # ubuntu-latest's apt repos are too old for those) and libavcodec-extra
      # (a runtime H264-recording concern, not a build dep). The rest are
      # mandatory: CMakeLists.txt hard-fails (FFTW3, via pkg_check_modules
      # REQUIRED) or is the actual thing under test (qt6-base-dev's bundled
      # QtTest headers) if any of them are missing.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-multimedia-dev \
            libqt6multimedia6 libqt6multimediawidgets6 \
            libfftw3-dev \
            libglib2.0-dev \
            pkg-config

      # src/media/ffmpegnative.cpp calls avcodec_get_supported_config() /
      # AV_CODEC_CONFIG_* (see lines ~967, ~1090, ~1692) — added in FFmpeg 7.1,
      # replacing the deprecated per-codec sample_fmts/supported_samplerates
      # fields. ubuntu-latest's own apt repos only go up to FFmpeg ~6.1, so
      # the native-FFmpeg build needs headers/libs from somewhere newer than
      # the distro. BtbN/FFmpeg-Builds publishes a continuously-rebuilt
      # FFmpeg master as a "shared" archive (headers + .so + pkg-config
      # files, not just the CLI binaries) at a filename that stays the same
      # across releases, via GitHub's "latest" release alias — so this URL
      # never needs bumping by hand as new FFmpeg versions ship.
      - name: Install a newer FFmpeg dev stack (BtbN build)
        run: |
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl-shared.tar.xz
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xf /tmp/ffmpeg.tar.xz -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          rm /tmp/ffmpeg.tar.xz
          # Exported for every later step in this job: pkg-config (used by
          # CMakeLists.txt's pkg_check_modules(AVFORMAT libavformat) etc.)
          # picks these headers/.pc files over any system ones, and the
          # dynamic linker needs LD_LIBRARY_PATH to find the matching .so
          # files at runtime — nothing installs them to a system lib dir.
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ffmpeg/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg/lib" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -version | head -1

      # Optional: CMakeLists.txt treats a missing ONNX Runtime as a graceful
      # feature-disable (vocal separation off), not a build failure — so this
      # is intentionally best-effort and kept out of the mandatory apt-get
      # call above, where one unresolvable package name would abort the
      # whole install and take FFTW3 down with it.
      - name: Install ONNX Runtime (optional — vocal separation support)
        run: sudo apt-get install -y libonnxruntime-dev || echo "libonnxruntime-dev unavailable on this runner — vocal separation will be disabled for this build, which is a supported configuration."

      - name: Configure
        # set -o pipefail: without it, a failing `cmake` (e.g. FFTW3 missing)
        # would be masked by `tee` succeeding, and the step would report green.
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log

      # CMakeLists.txt degrades missing/too-old FFmpeg to a graceful
      # CLI-fallback build instead of failing configure (see its own
      # FFMPEG_FOUND warning) — the right behaviour for a local dev machine
      # without the dev libs installed, but exactly the failure mode this
      # whole job exists to catch here: if the BtbN headers above didn't
      # actually get picked up, we want a loud CI failure, not a silently
      # downgraded build that still goes green.
      - name: Verify native FFmpeg was actually detected
        run: |
          grep -q "FFmpeg native libraries found" configure.log || {
            echo "::error::Native FFmpeg integration was not enabled — CMake fell back to the ffmpeg-CLI path. Check the BtbN download/PKG_CONFIG_PATH step above."
            exit 1
          }

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        working-directory: build
        # test_vocalenhancer/test_renderjob/test_vocalseparationjob link
        # Qt6::Gui/Widgets (transitively via wakkaqt_dsp/wakkaqt_jobs), so
        # QTEST_MAIN constructs a QApplication, not a QCoreApplication — that
        # needs a working QPA platform plugin, and this runner has no X11/
        # Wayland display for the default "xcb" plugin to connect to.
        # "offscreen" is Qt's own headless-CI platform plugin, no real
        # display required.
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure
